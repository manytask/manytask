name: course-template

on:
  pull_request:
    paths:
      - "course-template/**"
      - "checker/**"
      - ".github/workflows/course-template.yml"
  push:
    branches: [main]
    paths:
      - "course-template/**"
      - "checker/**"
      - ".github/workflows/course-template.yml"

permissions:
  contents: read

jobs:
  validate-and-no-leak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install UV
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.9.5

      - name: Install in-tree checker
        working-directory: checker
        run: uv sync --locked

      - name: checker validate
        working-directory: checker
        run: uv run checker validate ../course-template

      - name: Dry-export and assert no private files leak
        working-directory: checker
        run: |
          rm -rf /tmp/ct-export && mkdir -p /tmp/ct-export
          uv run checker export ../course-template /tmp/ct-export
          if find /tmp/ct-export -type f \( -name '*private*' -o -name '.releaser-ci.yml' \) | grep -q . \
            || test -e /tmp/ct-export/.sourcecraft \
            || test -e /tmp/ct-export/.sourcecraft.public; then
            echo "::error::private files leaked into export"; exit 1
          fi
          mkdir -p /tmp/ct-export/.sourcecraft
          cp ../course-template/.sourcecraft.public/ci.yaml /tmp/ct-export/.sourcecraft/ci.yaml
          test -s /tmp/ct-export/.sourcecraft/ci.yaml
          echo "clean export"

      - name: Build testenv and assert it has no raw private checkout
        run: |
          docker build --tag course-template-base --file course-template/base.docker course-template
          docker build \
            --tag course-template-testenv \
            --file course-template/testenv.docker \
            --build-arg BASE_IMAGE=course-template-base \
            course-template
          docker run --rm course-template-testenv sh -ec '
            test -d /opt/course
            test ! -e /build
            test ! -e /course-template
            test ! -e /opt/course/.git
          '
          if docker image history --no-trunc course-template-testenv | grep -q 'COPY . /build'; then
            echo "::error::raw private checkout found in final image history"
            exit 1
          fi
