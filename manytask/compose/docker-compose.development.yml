networks:
    manytask-dev-net:
        name: manytask-dev-net
        driver: bridge

services:

    docs:
        build:
            context: ../../docs
            target: docs
        ports:
            - "8082:80"
        networks:
            - manytask-dev-net

    manytask:
        build:
            context: ../..
            dockerfile: manytask/Dockerfile
            target: app
        container_name: test-manytask
        env_file: ../.env
        environment:
            VIRTUAL_HOST: localhost
            VIRTUAL_PORT: 5050
            LETSENCRYPT_HOST: localhost
        ports:
            - "8081:5050"
        volumes:
            - ../manytask:/app/manytask
            - ../.tmp/cache:/cache
        networks:
            - manytask-dev-net
        depends_on:
            pgbouncer:
                condition: service_healthy

    postgres:
        image: postgres:17
        container_name: manytask_postgres
        command: ["postgres", "-c", "max_locks_per_transaction=256"]
        env_file: ../.env
        expose:
            - "5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ../scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 5
        networks:
            - manytask-dev-net

    # Connection pooler for the gunicorn workers. Transaction pooling is safe: the app
    # uses no session-level state (no SET, advisory locks or server-side prepared statements).
    pgbouncer:
        image: edoburu/pgbouncer:v1.26.0-p0
        container_name: manytask_pgbouncer
        environment:
            DB_HOST: postgres
            DB_PORT: 5432
            DB_USER: ${POSTGRES_USER}
            DB_PASSWORD: ${POSTGRES_PASSWORD}
            ADMIN_USERS: ${POSTGRES_USER}
            AUTH_TYPE: scram-sha-256
            POOL_MODE: transaction
            MAX_CLIENT_CONN: 1000
            DEFAULT_POOL_SIZE: 50
            RESERVE_POOL_SIZE: 10
        expose:
            - "5432"
        healthcheck:
            test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432"]
            interval: 5s
            timeout: 5s
            retries: 5
        networks:
            - manytask-dev-net
        depends_on:
            postgres:
                condition: service_healthy

    gitlab:
        image: gitlab/gitlab-ce:latest
        container_name: manytask_gitlab
        restart: always
        hostname: gitlab
        env_file: ../.env
        environment:
            GITLAB_ROOT_PASSWORD: "changeme123!"
            GITLAB_OMNIBUS_CONFIG: |
                external_url 'http://localhost:8929'
                registry_external_url 'http://localhost:5050'
                gitlab_rails['gitlab_shell_ssh_port'] = 8222
                prometheus_monitoring['enable'] = false
                alertmanager['enable'] = false
                node_exporter['enable'] = false
                redis_exporter['enable'] = false
                postgres_exporter['enable'] = false
                gitlab_exporter['enable'] = false
                gitlab_kas['enable'] = false
                puma['worker_processes'] = 0
                sidekiq['concurrency'] = 10
                # Existing installations keep their embedded database until explicitly migrated.
                db_keys = %w[GITLAB_DB_NAME GITLAB_DB_USER GITLAB_DB_PASSWORD]
                db_configured = db_keys.map { |key| !ENV.fetch(key, '').empty? }
                if db_configured.any? && !db_configured.all?
                  raise 'Set all three GITLAB_DB_NAME, GITLAB_DB_USER, GITLAB_DB_PASSWORD, or leave all unset'
                end
                postgresql['enable'] = !db_configured.all?
                if db_configured.all?
                  gitlab_rails['db_adapter'] = 'postgresql'
                  gitlab_rails['db_encoding'] = 'unicode'
                  gitlab_rails['db_host'] = 'postgres'
                  gitlab_rails['db_port'] = 5432
                  gitlab_rails['db_database'] = ENV['GITLAB_DB_NAME']
                  gitlab_rails['db_username'] = ENV['GITLAB_DB_USER']
                  gitlab_rails['db_password'] = ENV['GITLAB_DB_PASSWORD']
                end
        ports:
            - "8929:8929"    # HTTP web UI
            - "5050:5050"    # Container registry
            - "8222:22"      # SSH (optional)
        shm_size: '256m'
        volumes:
            - gitlab_config:/etc/gitlab
            - gitlab_logs:/var/log/gitlab
            - gitlab_data:/var/opt/gitlab
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - manytask-dev-net

    gitlab-runner:
        image: gitlab/gitlab-runner:alpine
        container_name: manytask_gitlab_runner
        restart: always
        volumes:
            - gitlab_runner_config:/etc/gitlab-runner
            - /var/run/docker.sock:/var/run/docker.sock
        depends_on:
            - gitlab
        networks:
            - manytask-dev-net

volumes:
    postgres_data:
        name: manytask_postgres_data
    gitlab_config:
        name: manytask_gitlab_config
    gitlab_logs:
        name: manytask_gitlab_logs
    gitlab_data:
        name: manytask_gitlab_data
    gitlab_runner_config:
        name: manytask_gitlab_runner_config
