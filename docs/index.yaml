fullScreen: true
animated: false
blocks:
  - type: header-block
    indent:
      top: '0'
      bottom: '0'
    title: 'More teaching.<br>Less routine.'
    overtitle: "MANYTASK / TEST STUDENTS' SOLUTIONS"
    description: 'Run programming courses with automated tests, clear deadlines, and all your student scores in one place. Built around Git, shaped by your course.'
    width: l
    image:
      src: img/brand/21-shape-alphabet.svg
      alt: ''
    imageSize: m
    background:
      color: '#FFE2B3'
      fullWidth: true
    buttons:
      - text: Open Manytask
        theme: action
        size: promo
        url: https://app.manytask.org/
      - text: Explore the docs
        theme: outlined
        size: promo
        url: about.html
  - type: extended-features-block
    title:
      text: 'Your course. Your rules.'
    description: 'Choose the language and tools. Manytask connects the everyday work.'
    items:
      - title: 'Test the code.'
        label: '01'
        text: 'Run your own tests on student solutions. Keep reference solutions and private tests separate from the materials you share.'
        links:
          - text: Meet the checker
            url: checker_config.html
            theme: normal
            arrow: true
      - title: 'See the progress.'
        label: '02'
        text: 'Bring scores, task groups, and deadlines together. Give students a clear view of their results and what comes next.'
        links:
          - text: Explore the web app
            url: using_manytask.html
            theme: normal
            arrow: true
      - title: 'Keep it in Git.'
        label: '03'
        text: 'Version your course materials and give students their own repositories. Connect your deployment to GitLab or SourceCraft.'
        links:
          - text: Course as code
            url: course_as_code.html
            theme: normal
            arrow: true
  - type: content-layout-block
    textWidth: l
    textContent:
      title: 'From first task to final score.'
      text: |
        <ol class="mt-workflow">
          <li><strong>Prepare</strong><span>Keep tasks, tests, and grading rules in your course repository.</span></li>
          <li><strong>Push</strong><span>Students solve tasks and submit their code with Git.</span></li>
          <li><strong>Check</strong><span>Your CI runs the checker and reports the results.</span></li>
          <li><strong>Learn</strong><span>Follow scores and deadlines together in Manytask.</span></li>
        </ol>
      links:
        - text: Walk through a basic course
          url: basic_example.html
          theme: normal
          arrow: true
  - type: extended-features-block
    title:
      text: 'A good place to start.'
    description: 'Find the guide for what you want to do next.'
    items:
      - title: 'Learn with Manytask'
        text: 'Join your course, set up your repository, and submit your first solution.'
        links:
          - text: Student guide
            url: using_manytask.html
            theme: normal
            arrow: true
      - title: 'Build your course'
        text: 'Start with the course template, add your tasks, and configure the checker.'
        links:
          - text: Teacher guide
            url: basic_example.html
            theme: normal
            arrow: true
      - title: 'Make it your own'
        text: 'Deploy an instance, explore the API, or contribute to the open-source project.'
        links:
          - text: Developer guide
            url: dev.html
            theme: normal
            arrow: true
  - type: content-layout-block
    textWidth: l
    textContent:
      title: 'Made for teaching. Built together.'
      text: 'Manytask is open source. Help improve the tools, share your course experience, or ask the community a question.'
      links:
        - text: GitHub
          url: https://github.com/manytask/manytask
          theme: normal
          arrow: true
        - text: Open issues
          url: https://github.com/manytask/manytask/issues
          theme: normal
          arrow: true
        - text: Telegram community
          url: https://t.me/manytask_chat
          theme: normal
          arrow: true
  - type: content-layout-block
    size: s
    textWidth: l
    indent:
      top: '0'
    textContent:
      text: |
        <footer class="mt-site-footer">Powered by Yandex School of Data Analysis · 2017–2026</footer>
