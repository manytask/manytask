# CI pipeline executed in the TEACHER private repository.
#
# The pipeline deliberately builds the reusable checker/toolchain image before
# checking the course. The final testenv is built only after that check passes
# and contains the result of `checker export-private`, never the raw checkout.

variables:
  GIT_STRATEGY: clone
  GIT_SUBMODULE_STRATEGY: recursive
  # Review these course-specific defaults when copying the template.
  REGISTRY: "$CI_REGISTRY_IMAGE"
  MANYTASK_URL: "app.manytask.org"
  COURSE_NAME: "sandbox"
  MANYTASK_API: "$MANYTASK_URL/api/$COURSE_NAME"
  BRANCH_IMAGE_TAG: "$CI_COMMIT_REF_SLUG"
  BASE_IMAGE: "$CI_REGISTRY_IMAGE/ci-base:$CI_COMMIT_REF_SLUG"
  TESTENV_IMAGE: "$CI_REGISTRY_IMAGE/testenv-image:$CI_COMMIT_REF_SLUG"
  # The checker is installed from the monorepo because the PyPI release does
  # not yet contain the `validate` and `export-private` commands.
  CHECKER_PIP_SPEC: "git+https://github.com/manytask/manytask.git@26.0.5#subdirectory=checker"

stages:
  - verify
  - build-base
  - check
  - build-testenv
  - deploy

.docker:
  image: docker:20.10.18
  before_script:
    # Register config.json so Docker can pull and push course images.
    - mkdir -p "$HOME/.docker"
    - printf '%s' "$DOCKER_AUTH_CONFIG" > "$HOME/.docker/config.json"

verify:
  image: python:3.12-slim
  stage: verify
  rules:
    - if: $TRIGGER_PAYLOAD
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    - when: never
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends git && rm -rf /var/lib/apt/lists/*
    - python -m pip install --upgrade pip
    - pip install "$CHECKER_PIP_SPEC" pytest
  script:
    - checker validate

build-base:
  extends: .docker
  stage: build-base
  needs: ["verify"]
  rules:
    - if: $TRIGGER_PAYLOAD
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    - when: never
  script:
    - echo "building checker base image = $BASE_IMAGE"
    - docker build --tag "$BASE_IMAGE" --file base.docker --build-arg "CHECKER_PIP_SPEC=$CHECKER_PIP_SPEC" --no-cache .
    - docker push "$BASE_IMAGE"

check:
  image: "$BASE_IMAGE"
  stage: check
  needs: ["build-base"]
  rules:
    - if: $TRIGGER_PAYLOAD
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    - when: never
  script:
    - checker check . .

build-testenv:
  extends: .docker
  stage: build-testenv
  needs: ["check"]
  rules:
    - if: $TRIGGER_PAYLOAD
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    - when: never
  script:
    - echo "building testenv image = $TESTENV_IMAGE"
    - docker build --tag "$TESTENV_IMAGE" --file testenv.docker --build-arg "BASE_IMAGE=$BASE_IMAGE" --no-cache .
    - docker push "$TESTENV_IMAGE"

deploy-docker:
  extends: .docker
  stage: deploy
  needs: ["build-testenv"]
  rules:
    - if: $TRIGGER_PAYLOAD
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
    - when: never
  script:
    - docker pull "$TESTENV_IMAGE"
    - docker tag "$TESTENV_IMAGE" "$REGISTRY/testenv-image:latest"
    - docker push "$REGISTRY/testenv-image:latest"

deploy-manytask:
  image: curlimages/curl:latest
  stage: deploy
  needs: ["build-testenv"]
  rules:
    - if: $TRIGGER_PAYLOAD
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
    - when: never
  script:
    - 'curl --fail --data-binary "@.manytask.yml"
       -H "Authorization: Bearer $MANYTASK_TOKEN"
       -H "Content-Type: application/x-yaml"
       "https://$MANYTASK_API/update_config"'
    - 'curl --fail -X POST
       -H "Authorization: Bearer $MANYTASK_TOKEN"
       "https://$MANYTASK_API/update_cache"'

deploy-public:
  image: "$BASE_IMAGE"
  stage: deploy
  needs: ["build-testenv"]
  rules:
    - if: $TRIGGER_PAYLOAD
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
    - when: never
  variables:
    # Change this to the public repository for a copied course template.
    PUBLIC_REPO_URL: "https://oauth2:${GITLAB_API_TOKEN}@gitlab.manytask.org/sandbox/public.git"
  before_script:
    - git config --global user.email "ci@manytask.org"
    - git config --global user.name "Manytask CI"
    # checker export commits in ./export. Pre-clone the target so it never
    # discovers the detached private-repository checkout as its Git root.
    - |
      if ! git clone "$PUBLIC_REPO_URL" ./export; then
        mkdir -p ./export
        cd ./export
        git init
        git remote add origin "$PUBLIC_REPO_URL"
        cd ..
      fi
      cd ./export
      git checkout -B main
      cd ..
  script:
    - checker export --commit
