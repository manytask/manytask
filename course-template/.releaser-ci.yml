# CI pipeline executed in the TEACHER private repository.
#
# The pipeline deliberately builds the reusable checker/toolchain image before
# checking the course. The final testenv is built only after that check passes
# and contains the result of `checker export-private`, never the raw checkout.

variables:
  GIT_STRATEGY: clone
  GIT_SUBMODULE_STRATEGY: recursive
  # Review these course-specific defaults when copying the template.
  REGISTRY: "$CI_REGISTRY_IMAGE"
  MANYTASK_URL: "app.manytask.org"
  COURSE_NAME: "sandbox"
  MANYTASK_API: "$MANYTASK_URL/api/$COURSE_NAME"
  BRANCH_IMAGE_TAG: "$CI_COMMIT_REF_SLUG"
  BASE_IMAGE: "$REGISTRY/ci-base:$CI_COMMIT_REF_SLUG"
  TESTENV_IMAGE: "$REGISTRY/testenv-image:$CI_COMMIT_REF_SLUG"
  # The checker is installed from the monorepo because the PyPI release does
  # not yet contain the `validate` and `export-private` commands.
  CHECKER_PIP_SPEC: "git+https://github.com/manytask/manytask.git@26.2.1#subdirectory=checker"

stages:
  - verify
  - build-base
  - check
  - build-testenv
  - deploy

# Rootless BuildKit starts its own temporary daemon inside the job. No host
# Docker socket, Docker-in-Docker service, or privileged runner is required.
# The runner must allow user namespaces; see README.md for security_opt settings.
.buildkit:
  image:
    name: moby/buildkit:rootless
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  before_script:
    - export DOCKER_CONFIG="$HOME/.docker"
    - mkdir -p "$DOCKER_CONFIG"
    # First match wins: Docker config, explicit registry credentials, or the
    # current GitLab instance's CI credentials. Never print credentials.
    - |
      REGISTRY_HOST="${REGISTRY%%/*}"
      if [ -n "$DOCKER_AUTH_CONFIG" ]; then
        printf '%s' "$DOCKER_AUTH_CONFIG" > "$DOCKER_CONFIG/config.json"
      else
        if [ -n "$REGISTRY_USERNAME" ] && [ -n "$REGISTRY_PASSWORD" ]; then
          AUTH_USER="$REGISTRY_USERNAME"
          AUTH_PASSWORD="$REGISTRY_PASSWORD"
        elif [ -n "$CI_REGISTRY" ] && [ "$REGISTRY_HOST" = "$CI_REGISTRY" ]; then
          AUTH_USER="${CI_REGISTRY_USER:-gitlab-ci-token}"
          AUTH_PASSWORD="${CI_REGISTRY_PASSWORD:-$CI_JOB_TOKEN}"
        else
          echo "ERROR: No registry credentials. Set DOCKER_AUTH_CONFIG or REGISTRY_USERNAME/REGISTRY_PASSWORD." >&2
          exit 1
        fi
        REGISTRY_AUTH="$(printf '%s:%s' "$AUTH_USER" "$AUTH_PASSWORD" | base64 | tr -d '\n')"
        printf '{"auths":{"%s":{"auth":"%s"}}}' "$REGISTRY_HOST" "$REGISTRY_AUTH" > "$DOCKER_CONFIG/config.json"
      fi
  after_script:
    - rm -f "$HOME/.docker/config.json"

verify:
  image: python:3.12-slim
  stage: verify
  rules:
    - if: $TRIGGER_PAYLOAD
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    - when: never
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends git && rm -rf /var/lib/apt/lists/*
    - python -m pip install --upgrade pip
    - pip install "$CHECKER_PIP_SPEC" pytest
  script:
    - checker validate

build-base:
  extends: .buildkit
  stage: build-base
  needs: ["verify"]
  rules:
    - if: $TRIGGER_PAYLOAD
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    - when: never
  script:
    - echo "building checker base image = $BASE_IMAGE"
    - |
      buildctl-daemonless.sh build \
        --progress=plain \
        --frontend=dockerfile.v0 \
        --local context="$CI_PROJECT_DIR" \
        --local dockerfile="$CI_PROJECT_DIR" \
        --opt filename=base.docker \
        --opt "build-arg:CHECKER_PIP_SPEC=$CHECKER_PIP_SPEC" \
        --import-cache "type=registry,ref=$REGISTRY/buildkit-cache:base" \
        --export-cache "type=registry,ref=$REGISTRY/buildkit-cache:base,mode=max,ignore-error=true" \
        --output "type=image,name=$BASE_IMAGE,push=true"

check:
  image: "$BASE_IMAGE"
  stage: check
  needs: ["build-base"]
  rules:
    - if: $TRIGGER_PAYLOAD
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    - when: never
  script:
    - checker check . .

build-testenv:
  extends: .buildkit
  stage: build-testenv
  needs: ["check"]
  rules:
    - if: $TRIGGER_PAYLOAD
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: on_success
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
    - when: never
  script:
    - echo "building testenv image = $TESTENV_IMAGE"
    # Do not export a registry cache here: intermediate stages contain the raw
    # teacher checkout. Only the final export-private image may be published.
    - |
      buildctl-daemonless.sh build \
        --progress=plain \
        --frontend=dockerfile.v0 \
        --local context="$CI_PROJECT_DIR" \
        --local dockerfile="$CI_PROJECT_DIR" \
        --opt filename=testenv.docker \
        --opt "build-arg:BASE_IMAGE=$BASE_IMAGE" \
        --output "type=image,name=$TESTENV_IMAGE,push=true"

deploy-docker:
  extends: .buildkit
  stage: deploy
  needs: ["build-testenv"]
  rules:
    - if: $TRIGGER_PAYLOAD
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
    - when: never
  script:
    # Promote the checked image without rebuilding the course or copying the
    # private checkout into another build context.
    - |
      PROMOTE_DIR="$(mktemp -d)"
      printf 'ARG TESTENV_IMAGE\nFROM ${TESTENV_IMAGE}\n' > "$PROMOTE_DIR/Dockerfile"
      buildctl-daemonless.sh build \
        --progress=plain \
        --frontend=dockerfile.v0 \
        --local context="$PROMOTE_DIR" \
        --local dockerfile="$PROMOTE_DIR" \
        --opt "build-arg:TESTENV_IMAGE=$TESTENV_IMAGE" \
        --output "type=image,name=$REGISTRY/testenv-image:latest,push=true"

deploy-manytask:
  image: curlimages/curl:latest
  stage: deploy
  needs: ["build-testenv"]
  rules:
    - if: $TRIGGER_PAYLOAD
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
    - when: never
  script:
    - 'curl --fail --data-binary "@.manytask.yml"
       -H "Authorization: Bearer $MANYTASK_TOKEN"
       -H "Content-Type: application/x-yaml"
       "https://$MANYTASK_API/update_config"'

deploy-public:
  image: "$BASE_IMAGE"
  stage: deploy
  needs: ["build-testenv"]
  rules:
    - if: $TRIGGER_PAYLOAD
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
    - when: never
  variables:
    # Change this to the public repository for a copied course template.
    PUBLIC_REPO_URL: "https://oauth2:${GITLAB_API_TOKEN}@gitlab.manytask.org/sandbox/public.git"
  before_script:
    - git config --global user.email "ci@manytask.org"
    - git config --global user.name "Manytask CI"
    # checker export commits in ./export. Pre-clone the target so it never
    # discovers the detached private-repository checkout as its Git root.
    - |
      if ! git clone "$PUBLIC_REPO_URL" ./export; then
        mkdir -p ./export
        cd ./export
        git init
        git remote add origin "$PUBLIC_REPO_URL"
        cd ..
      fi
      cd ./export
      git checkout -B main
      cd ..
  script:
    - checker export --commit
