# Optional GPU group; enable it in ../.manytask.yml on a CUDA-capable worker.
# vector_add_cuda supplies the CUDA/Catch2 project and reference solution.
# Run on a Linux GPU worker with Firejail, CUDA, CMake, Ninja and Catch2 installed.
# The worker assigns a GPU and sets CUDA_VISIBLE_DEVICES before checker starts.
version: 1

parameters:
  tests: [cuda_tests, RelWithDebInfo]
  benchmark: cuda_benchmarks
  benchmark_values: [vector_add, "0.01"]  # Upper bound in seconds; tune per worker.
  timeout: 30
  sanitizer_timeout: 120
  cuda_env_whitelist: [PATH, CUDA_VISIBLE_DEVICES, LD_LIBRARY_PATH]
  compute_sanitizer:
    - /usr/local/cuda/bin/compute-sanitizer  # Adjust for the worker's installation.
    - --tool
    - memcheck
    - --leak-check
    - full
    - --error-exitcode
    - "1"

task_pipeline:
  - name: Configure CUDA targets
    run: safe_run_script
    args:
      origin: ${{ global.temp_dir }}/${{ task.task_sub_path }}
      script:
        - cmake
        - -S
        - .
        - -B
        - build-relwithdebinfo
        - -G
        - Ninja
        - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      env_whitelist: ${{ parameters.cuda_env_whitelist }}
      timeout: 120

  - name: Build CUDA targets
    run: safe_run_script
    args:
      origin: ${{ global.temp_dir }}/${{ task.task_sub_path }}
      script:
        - cmake
        - --build
        - build-relwithdebinfo
        - --target
        - cuda_tests
        - cuda_benchmarks
      env_whitelist: ${{ parameters.cuda_env_whitelist }}
      timeout: 120

  - name: CUDA correctness
    run: cpp_run_tests
    args: &test_args
      root: ${{ global.temp_dir }}/${{ task.task_sub_path }}
      tests: ${{ parameters.tests }}
      timeout: ${{ parameters.timeout }}
      no_detect_leaks: false
      args: []
      paths_whitelist: []
      env_whitelist: ${{ parameters.cuda_env_whitelist }}

  - name: CUDA memory checks
    run: cpp_run_tests
    args:
      <<: *test_args
      timeout: ${{ parameters.sanitizer_timeout }}
      command_prefix: ${{ parameters.compute_sanitizer }}

  # Time the ordinary binary, without Compute Sanitizer instrumentation.
  - name: CUDA benchmarks
    run: cpp_run_benchmarks
    args:
      root: ${{ global.temp_dir }}/${{ task.task_sub_path }}
      benchmark: ${{ parameters.benchmark }}
      benchmark_values: ${{ parameters.benchmark_values }}
      timeout: ${{ parameters.timeout }}
      args: []
      env_whitelist: ${{ parameters.cuda_env_whitelist }}
